<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Nuts and bolts. Two bold shapes, minimal inner detail, heavy outlines —
       tuned to still read as a nut + a bolt at 16px in a browser tab. -->
  <g stroke="#141c26" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">

    <!-- bolt: hex head + threaded shank, on a diagonal behind the nut -->
    <g transform="translate(29 30) rotate(-38)">
      <rect x="-2" y="-5" width="19" height="10" rx="1.5" fill="#7d97b4"/>
      <g stroke="#141c26" stroke-width="1.6" opacity=".85">
        <line x1="5" y1="-5" x2="5" y2="5"/>
        <line x1="11" y1="-5" x2="11" y2="5"/>
      </g>
      <polygon points="-2,-9 -7.5,-9 -11.5,0 -7.5,9 -2,9" fill="#adc3da"/>
    </g>

    <!-- hex nut, front left -->
    <g transform="translate(18 18)">
      <polygon points="0,-15.5 13.4,-7.75 13.4,7.75 0,15.5 -13.4,7.75 -13.4,-7.75"
               fill="#9db4cf"/>
      <circle cx="0" cy="0" r="6.6" fill="#1b2530"/>
    </g>
  </g>
</svg>
